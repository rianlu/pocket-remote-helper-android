plugins {
    id "com.android.application"
}

android {
    namespace "com.pocketremote.helper"
    compileSdk 35
    defaultConfig {
        applicationId "com.pocketremote.helper"
        minSdk 16
        targetSdk 21
        versionCode 25
        versionName "0.2.8"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main.assets.srcDirs += file("$buildDir/generated/pluginAsset")
    }
}

def pluginAssetDir = file("$buildDir/generated/pluginAsset")
tasks.register("copyPluginAsset") {
    group = "build"
    description = "把平台签名插件打进助手 assets，用户只装一个 APK"
    dependsOn ":plugin:signPlatform"
    def src = rootProject.file("plugin/build/outputs/apk/debug/plugin-platform.apk")
    inputs.file(src)
    outputs.dir(pluginAssetDir)
    doLast {
        pluginAssetDir.mkdirs()
        def dest = new File(pluginAssetDir, "plugin.apk")
        dest.bytes = src.bytes
    }
}
tasks.named("preBuild").configure { dependsOn "copyPluginAsset" }
afterEvaluate {
    tasks.matching { it.name.toLowerCase().contains("assets") }.configureEach {
        dependsOn "copyPluginAsset"
    }
}

dependencies {
    implementation project(":inject-api")
}
